# Render Blueprint pour SahaTN — API backend uniquement (plan gratuit).
# Le frontend est hébergé sur Vercel et proxy /api/* vers ce service.
services:
  - type: web
    name: sahatn-backend
    runtime: node
    repo: https://github.com/koukijihed/sahaTN
    branch: main
    rootDir: backend
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      # URL publique du frontend (Vercel). Renseigner après déploiement.
      - key: CORS_ORIGIN
        sync: false
      # Désactivée en production par défaut ; maintenue explicite.
      - key: ENABLE_API_DOCS
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: sahatn_session
      - key: CSRF_COOKIE_NAME
        value: sahatn_csrf
      - key: SESSION_TTL_SECONDS
        value: 604800
      # Vide = cookie host-only sur l'origine du frontend (proxy /api/*).
      - key: COOKIE_DOMAIN
        value: ""
      - key: LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: DOCUMENT_MAX_FILE_BYTES
        value: 5242880
      # Vide = <backend>/storage/private-documents (éphémère sans disque).
      - key: DOCUMENT_STORAGE_DIR
        value: ""
