# Render Blueprint pour SahaTN (Nutri / "Best Platform" - demo fictif)
services:
  - type: web
    name: sahatn-backend
    runtime: node
    repo: https://github.com/USERNAME/REPO # adapte si besoin
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev=false && npx prisma generate && npm run build
    startCommand: npm run start:prod
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: CORS_ORIGIN
        sync: false # ex: https://sahatn-frontend.onrender.com
      - key: ENABLE_API_DOCS
        value: false
      - key: DATABASE_URL
        sync: false # Neon: postgresql://user:pass@host:5432/db?sslmode=require
      - key: SESSION_COOKIE_NAME
        value: sahatn_session
      - key: CSRF_COOKIE_NAME
        value: sahatn_csrf
      - key: SESSION_TTL_SECONDS
        value: 604800
      - key: COOKIE_DOMAIN
        sync: false
      - key: LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: DOCUMENT_MAX_FILE_BYTES
        value: 5242880
      - key: DOCUMENT_STORAGE_DIR
        value: /var/data/private-documents
    disk:
      name: sahatn-backend-private
      mountPath: /var/data/private-documents
      sizeGB: 1
    healthCheckPath: /api/health

  - type: web
    name: sahatn-frontend
    runtime: node
    repo: https://github.com/USERNAME/REPO # adapte si besoin
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: sahatn-backend
          type: web
          property: hostport
      - key: NEXT_PUBLIC_APP_URL
        sync: false # ex: https://sahatn-frontend.onrender.com
